<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="100%" height="100%">
  <defs>
    <!-- Facet Gradients for the Upward Growth Arrow -->
    <linearGradient id="goldArrowLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDB740" />
      <stop offset="100%" stop-color="#C98B19" />
    </linearGradient>
    <linearGradient id="goldArrowRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4941F" />
      <stop offset="100%" stop-color="#A1670B" />
    </linearGradient>
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2A229" />
      <stop offset="100%" stop-color="#BD7C10" />
