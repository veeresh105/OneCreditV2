  <!-- Diagonal connector of N -->
  <polygon points="76,39 88,28 121,63 109,74" fill="url(#goldStem)" />
  
  <!-- Vertical column of N extending up into the arrow shaft -->
  <rect x="109" y="22" width="12" height="52" fill="url(#goldStem)" />

  <!-- Upward Arrowhead with 3D Center Crease -->
  <!-- Left facet of Arrowhead -->
